filesystem:
  endpoint: 
  bucket: 
aws:
  access_key: 
  secret_access_key: 
  session_token: 
  default_region: 
requests:
  useragent: Web-FOSS-NL-webfocusedscrape/0.1 (https://github.com/SNStatComp/webfocusedscrape)
  timeout_connect: 3 # In seconds 
  timeout_read: 7 # In seconds 
  max_retries: 3
input:
  input_dir: input
  input_files:
    skip_domains: skip_domains.txt
    urls: urls.txt
    target_netloc_keywords: target_netloc_keywords.txt
    target_path_keywords: target_path_keywords.txt
    jump_netloc_keywords: jump_netloc_keywords.txt
    jump_path_keywords: jump_path_keywords.txt
  url_max: 100
  url_offset: 0
  input_variables:
output:
  output_dir: output
  batchsize: 100
  logs: logs
crawl:
  max_duration: 500
  max_depth: 2
  max_jumps: 1
  max_sitemap_depth: 1
  sitemap_page_budget: 5000
  allowed_countries: [nl]
  use_sitemap: True
  use_jump_whitelist: True
  schema:
    keyword: